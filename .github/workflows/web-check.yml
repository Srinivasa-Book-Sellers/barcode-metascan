name: Web UI check

on:
  push:
    branches: [main, ui_web]
    paths:
      - ui_web/**
      - .github/workflows/web-check.yml
  pull_request:
    branches: [main]
    paths:
      - ui_web/**
      - .github/workflows/web-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check web UI on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify website
        shell: pwsh
        run: |
          if (-not (Test-Path ui_web/index.html -PathType Leaf)) {
            throw "ui_web/index.html does not exist"
          }
          if (-not (Select-String -Path ui_web/index.html -SimpleMatch 'Hello, Barcode MetaScan!' -Quiet)) {
            throw "Expected page heading was not found"
          }
      - name: Test barcode form
        run: node --test ui_web/app.test.mjs