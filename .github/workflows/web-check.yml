name: Web UI check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test web UI on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify website
        shell: pwsh
        run: |
          if (-not (Test-Path ui_web/index.html -PathType Leaf)) {
            throw "ui_web/index.html does not exist"
          }
          if (-not (Select-String -Path ui_web/index.html -SimpleMatch 'Hello, Barcode MetaScan!' -Quiet)) {
            throw "Expected page heading was not found"
          }
      - name: Test web UI
        run: node --test ui_web/app.test.mjs