name: Deploy web UI

on:
  push:
    branches: [main, ui_web]
    paths:
      - ui_web/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify entry page
        run: |
          test -f ui_web/index.html
          grep -q '<!doctype html>' ui_web/index.html
          grep -q '<meta name="viewport"' ui_web/index.html
          grep -q 'Hello, Barcode MetaScan!' ui_web/index.html

  deploy:
    name: Publish to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui_web
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4